[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_rl"]

[tool.uv.dependency-groups]
authoring-mlx = { requires-python = ">=3.13,<3.14" }
